<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lifestreams</title>
<link rel="stylesheet" href="app.css">
<!-- apply a saved light/dark choice before first paint, so there is no flash -->
<script>try { const t = localStorage.getItem('ls:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<!-- three.js addons import the bare specifier "three"; map it to the same copy Atlas uses -->
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/threeaddons/" } }</script>
</head>
<body>
<div class="app">
  <header>
    <button id="menuBtn" class="op small" style="display:none">☰</button>
    <div class="logo">Life<span>streams</span></div>
    <label class="find">
      <span class="mode" id="mode">find</span>
      <input id="q" autocomplete="off" spellcheck="false"
        placeholder='find:  type:email from:alice  ·  ~"renovation"  ·  or ask:  what did the electrician quote?'>
      <kbd>⌘K</kbd>
    </label>
    <div class="views" id="views" role="tablist" aria-label="View">
      <button data-view="feed" title="Feed — vertical, newest first (1)">Feed</button>
      <button data-view="stack" title="Stack — the 1997 receding stack (2)">Stack</button>
      <button data-view="river" title="River — days flowing left to right (3)">River</button>
      <button data-view="atlas" title="Atlas — every document on the GPU, zoom from map to full detail (4)">Atlas</button>
      <button data-view="hall" title="Hall — walk a pseudo-3D gallery corridor through time (5)">Hall</button>
      <button data-view="vista" title="Vista — days receding along a diagonal, documents standing in rows (6)">Vista</button>
      <button data-view="classic" title="Classic — the 1997 diagonal stack, glance and time slider (7)">Classic</button>
      <button data-view="modern" title="Modern — the same stack on the GPU: depth of field, soft shadows, springs (9)">Modern</button>
      <button data-view="calendar" title="Calendar — month grid with the day's agenda (8)">Calendar</button>
    </div>
    <select id="viewSelect" class="view-select" aria-label="View">
      <option value="feed">Feed</option><option value="stack">Stack</option><option value="river">River</option><option value="atlas">Atlas</option>
      <option value="hall">Hall</option><option value="vista">Vista</option><option value="classic">Classic</option><option value="modern">Modern</option><option value="calendar">Calendar</option>
    </select>
    <button class="op small theme-btn" id="themeBtn" aria-label="Theme"></button>
    <span class="pill" id="llm" title="">model</span>
    <span class="clock" id="clock"></span>
  </header>
  <main>
    <nav class="rail" id="rail">
      <h3>Substreams</h3>
      <div id="subs"></div>
      <div class="help">◆ persistent · ◇ temporary — click to pin</div>
      <h3>Agents</h3>
      <div id="agents"></div>
    </nav>
    <section class="stream" id="stream"></section>
    <aside class="pane" id="pane"></aside>
    <div class="mini" id="mini" title="Drag to travel through time"><canvas id="cv"></canvas></div>
  </main>
  <footer>
    <button class="op" id="opNew" title="New document at the head of the stream (N)">New</button>
    <button class="op" id="opClone" disabled>Clone</button>
    <button class="op" id="opXfer" disabled>Transfer</button>
    <span class="split">
      <button class="op primary" id="opSum">Summarize</button>
      <button class="op primary" id="opSumMore" title="Other summarizers">▾</button>
    </span>
    <span class="status" id="status"></span>
  </footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
